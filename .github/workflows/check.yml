name: Clean-checkout HINT-SD Search-QA checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  method:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.3.5 requests==2.32.5 omegaconf==2.3.0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==5.17.0 peft==0.21.0 accelerate==1.15.0 python-dotenv==1.2.2 datasets==4.8.5
      - run: python -m hint_searchqa.setup --framework
      - run: python -m hint_searchqa.setup --verify
      - run: python scripts/check_release.py
      - run: python -m pytest tests/test_contract.py tests/test_native_trainer.py -q
      - run: bash -n scripts/setup.sh scripts/train.sh scripts/eval.sh
      - run: bash scripts/train.sh --dry-run
  environment-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r configs/requirements-cpu.txt
      - run: python -m hint_searchqa.setup --framework
      - run: python src/data.py --prepare --verify
      - run: python src/env_smoke.py
      - run: python -m pytest tests/test_searchqa.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: searchqa-cpu-data-environment-receipts
          path: |
            results/environment_smoke.json
            data/searchqa/data_receipt.json
            data/searchqa/validation_subset_receipt.json
          if-no-files-found: ignore
